name: Tests

on:
  push:
    branches: [main]
    paths:
      - "extraction.py"
      - "schemas/*.py"
      - "tests/**/*.py"
      - "test_documents/**"
      - "conftest.py"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "extraction.py"
      - "schemas/*.py"
      - "tests/**/*.py"
      - "test_documents/**"
      - "conftest.py"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest --suite=full -v
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          MIMO_MODEL: ${{ vars.MIMO_MODEL || 'mimo-v2.5' }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update reports.json [skip ci]"
          file_pattern: reports.json
