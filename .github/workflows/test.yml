name: CI

on:
  push:
    branches: [main]
    paths:
      - "extraction.py"
      - "schemas/*.py"
      - "tests/**/*.py"
      - "test_documents/**"
      - "conftest.py"
      - "utils/**"
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "ruff.toml"
  pull_request:
    branches: [main]
    paths:
      - "extraction.py"
      - "schemas/*.py"
      - "tests/**/*.py"
      - "test_documents/**"
      - "conftest.py"
      - "utils/**"
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "ruff.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: extractions/setup-just@v2
      - name: Lint
        run: just lint
      - name: Test
        run: just test-parallel
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          MIMO_MODEL: ${{ vars.MIMO_MODEL || 'mimo-v2.5' }}
      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports.json
          retention-days: 90
      - name: Write job summary
        if: always()
        run: python3 scripts/ci/generate_summary.py >> $GITHUB_STEP_SUMMARY
